name: Build WhiteShell APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Generate Signing Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkey -v -keystore TMessagesProj/config/extera.jks \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=WhiteShell, OU=Dev, O=WhiteShell, L=City, S=State, C=US"

      - name: Create fallback google-services.json
        run: |
          if [ ! -f TMessagesProj/google-services.json ]; then
            cat << 'EOF' > TMessagesProj/google-services.json
            {
              "project_info": {
                "project_number": "1234567890",
                "project_id": "whiteshell-app",
                "storage_bucket": "whiteshell-app.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                    "android_client_info": {
                      "package_name": "org.whiteshell.client"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "dummy_api_key" }],
                  "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Universal APK
        run: ./gradlew assembleAfat --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteShell-Universal-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
